name: Specific School Release

on:
  workflow_call:
  push:
    branches:
      - 'release/school_v**'


jobs:
  cancel-previous-runs:
    runs-on: ubuntu-latest

    steps:
      - name: Cancel previous runs of this workflow on same branch
        uses: rokroskar/workflow-run-cleanup-action@v0.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  install-frameworks:
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - uses: actions/checkout@v2
        with:
          clean: false

      - name: Initialize Fastlane Environment Files
        run: |
          ./Release/set_fastlane_env.rb

      - name: Install Frameworks
        run: |
          fastlane install_packages --env saint-marc_schooldebug
        env:
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8

  upload-teacher-testflight:
    runs-on: [self-hosted, macOS, ARM64]
    needs: [install-frameworks]

    steps:
      - name: Set build number
        run: agvtool new-version -all ${{ github.run_number }}
      - name: Upload Teacher Build
        timeout-minutes: 1440
        run: |
          fastlane upload_to_appstore --env $PULL_REQUEST_BODY
        env:
          PULL_REQUEST_BODY: ${{ github.event.head_commit.message }}
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8

  post-actions:
    runs-on: [self-hosted, macOS, ARM64]
    needs: [upload-teacher-testflight]

    steps:
      - name: Clean Xcode build cache
        run: rm -rf ~/Library/Developer/Xcode/Archives
