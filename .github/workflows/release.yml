name: Release

on:
  push:
    branches:
      - 'release/**'

jobs:
  install-frameworks:
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - uses: actions/checkout@v2
        with:
          clean: false

      - name: Bundle Install
        run: bundle update

      - name: Initialize Fastlane Environment Files
        run: |
          ./release/prepare_release_scripts.rb

  upload-to-testflight:
    if: "contains(github.event.head_commit.message, '[ci release]')"
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 1440  # Set timeout to 24h
    needs: [install-frameworks]

    steps:
      - name: Set build number
        run: agvtool new-version -all ${{ github.run_number }}

      - name: Upload Apps
        run: |
          ./Release/upload_to_appstore.sh
        env:
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8

  post-actions:
    runs-on: [self-hosted, macOS, ARM64]
    needs: [upload-to-testflight]

    steps:
      - name: Clean Xcode build cache
        run: rm -rf ~/Library/Developer/Xcode/Archives

  cancel-handler:
    runs-on: [self-hosted, macOS, ARM64]
    if: cancelled()
    needs: [install-frameworks, upload-to-testflight, post-actions] 
    steps:
      - name: Remove log file due to cancellation
        run: |
          echo "Workflow was cancelled. Removing log file..."
          rm -f ./upload_progress.log
