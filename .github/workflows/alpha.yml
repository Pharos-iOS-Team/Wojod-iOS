name: Alpha

on:
  push:
    branches: [develop]

jobs:
  cancel-previous-runs:
    runs-on: ubuntu-latest

    steps:
      - name: Cancel previous runs of this workflow on same branch
        uses: rokroskar/workflow-run-cleanup-action@v0.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  install-frameworks:
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - uses: actions/checkout@v2
        with:
          clean: false

      - name: Bundle Install
        run: bundle install

      - name: Initialize Fastlane Environment Files
        run: |
          ./Release/prepare_release_scripts.rb

  upload-student-testflight:
    runs-on: [self-hosted, macOS, ARM64]
    needs: [install-frameworks]

    steps:
      - name: Upload Student Staging Build
        run: |
          fastlane alpha --env saint-marc_schooldebug
          fastlane alpha --env skoolix_schooldebug
        env:
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8

  upload-teacher-testflight:
    runs-on: [self-hosted, macOS, ARM64]
    needs: [install-frameworks]

    steps:
      - name: Upload Teacher Staging Build
        run: |
          fastlane alpha --env saint-marc_teacherdebug
          fastlane alpha --env skoolix_teacherdebug
        env:
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8

  post-actions:
    runs-on: [self-hosted, macOS, ARM64]
    needs: [upload-teacher-testflight, upload-student-testflight]

    steps:
      - name: Clean Xcode build cache
        run: rm -rf ~/Library/Developer/Xcode/Archives

